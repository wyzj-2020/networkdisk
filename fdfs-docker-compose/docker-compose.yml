version: '3'

services:
  # FastDFS Tracker - 跟踪服务器
  tracker:
    image: delron/fastdfs
    container_name: tracker
    restart: always
#    network_mode: host
    command: "tracker"
    volumes:
      - "./data/tracker_data:/fastdfs/tracker/data"
#    environment:
#      - TRACKER_BASE_PATH=/var/fdfs
#      - TRACKER_PORT=22122
    ports:
      - "22122:22122"
#    healthcheck:
#      test: ["CMD", "fdfs_monitor", "/etc/fdfs/client.conf"]
#      interval: 10s
#      timeout: 5s
#      retries: 10
#      start_period: 30s

  # FastDFS Storage - 存储服务器
  storage:
    image: delron/fastdfs
    container_name: storage
    restart: always
    links:
      - tracker
#    network_mode: host
    command: "storage"
#    depends_on:
#      fastdfs-tracker:
#        condition: service_healthy
    volumes:
      - "./storage.conf:/fdfs_conf/storage.conf"
      - "./data/storage_base_path:/fastdfs/storage/data"
      - "./data/store_path0:/fastdfs/store_path"
    environment:
      - TRACKER_SERVER=tracker:22122
#      - STORAGE_BASE_PATH=/var/fdfs
#      - STORAGE_PORT=23000
#      - HTTP_SERVER_PORT=8888
#      - GROUP_NAME=group1
    ports:
      - "23000:23000"
#      - "8888:8888"
#    healthcheck:
#      test: ["CMD", "fdfs_monitor", "/etc/fdfs/client.conf"]
#      interval: 10s
#      timeout: 5s
#      retries: 10
#      start_period: 40s

  # Nginx - 用于文件访问（可选，但推荐）
  nginx:
    image: delron/fastdfs
    container_name: fdfs-nginx
    restart: always
    links:
      - tracker
#    depends_on:
#      - fastdfs-storage
    ports:
      - "8088:8088"
    volumes:
      - "./nginx.conf:/rtc/nginx/conf/nginx.conf"
      - "./data/store_path0:/fastdfs/store_path"
    command: "nginx"

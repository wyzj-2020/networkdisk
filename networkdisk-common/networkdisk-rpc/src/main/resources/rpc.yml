dubbo:
  consumer:
    timeout: 3000
    check: false
  protocol:
    name: dubbo
    port: -1
#  config-center:
#    address: nacos://127.0.0.1:8848
#    parameters:
#      namespace: 02a04b72-0002-4d8f-b8ad-c8fc347e9ba6
##      group: wyz-0612
#  metadata-report:
#    address: nacos://127.0.0.1:8848
#    parameters:
#      namespace: 02a04b72-0002-4d8f-b8ad-c8fc347e9ba6
##      group: wyz-0612

  registry:
    address: nacos://127.0.0.1:8848 #首次启动前务必修改成你自己的
    parameters:
      namespace: 02a04b72-0002-4d8f-b8ad-c8fc347e9ba6  # 自己到nacos上创建一个给dubbo用的namespce，然后和这里保持一致，首次启动前务必修改成个人的
      group: dubbo #首次启动前务必修改为个人的
  application:
    name: ${spring.application.name}
    qos-enable: true
    qos-accept-foreign-ip: false